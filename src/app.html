<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Fontes: SN Pro (CDN) + Outfit, Plus Jakarta Sans, Fira Code (Google Fonts) -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@fontsource/sn-pro@latest/index.min.css"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#121214] text-[#f4f4f5] antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
